# DATABASE - configure via env vars (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI POOL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AUTH (Supabase) - ES256, validated against JWKS
app.supabase.jwks-uri=https://lhvrbtxqnsvnrallqaif.supabase.co/auth/v1/.well-known/jwks.json
app.supabase.issuer=https://lhvrbtxqnsvnrallqaif.supabase.co/auth/v1

# CORS - comma-separated origins
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000}

# CHAT - Python AI service URL
app.chat.api-url=${CHAT_API_URL:http://localhost:8000/api/chat}

# LOGGING
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.level.com.example.drishti=DEBUG