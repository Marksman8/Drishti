# DATABASE - configure via env vars (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI POOL
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AUTH - HS256 JWT signed with shared secret (must be >= 32 chars)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:drishti}
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL:86400}
app.jwt.verification-token-ttl-seconds=${JWT_VERIFY_TTL:86400}
app.jwt.reset-token-ttl-seconds=${JWT_RESET_TTL:3600}

# Set REQUIRE_EMAIL_VERIFIED=false in dev to log in without confirming email.
app.auth.require-email-verified=${REQUIRE_EMAIL_VERIFIED:true}

# Google Sign-In: OAuth 2.0 Web client ID from Google Cloud Console.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Dev-mock phone OTP: return the code in the API response so the UI can show it.
app.phone.dev-return-otp=${PHONE_DEV_RETURN_OTP:true}
# Fixed OTP that always verifies ADMIN accounts.
app.phone.admin-otp=${PHONE_ADMIN_OTP:000000}
# Set FAST2SMS_API_KEY to send real SMS to non-admin users; blank = console mock.
app.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}

# MAIL - SMTP (Gmail, SendGrid, etc.). Optional in dev; leave blank to skip sending.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@drishti.local}
app.mail.frontend-url=${FRONTEND_URL:http://localhost:3000}

# CORS - comma-separated origins
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000}

# CHAT - Python AI service URL
app.chat.api-url=${CHAT_API_URL:http://localhost:8000/api/chat}

# LOGGING (override via env: LOG_LEVEL_SECURITY=INFO in production)
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.org.springframework.security.oauth2=${LOG_LEVEL_OAUTH2:DEBUG}
logging.level.com.example.drishti=${LOG_LEVEL_APP:DEBUG}
