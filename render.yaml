# Render Blueprint — deploys all three Drishti services in one click.
# Connect your repo at https://dashboard.render.com/blueprints
#
# IMPORTANT: secret env vars marked `sync: false` must be filled in via the
# Render dashboard after the services are created — do NOT commit them here.

services:
  # ----------------------------------------------------------
  # Spring Boot backend
  # ----------------------------------------------------------
  - type: web
    name: drishti-backend
    runtime: docker
    rootDir: drishti-backend/drishti
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/public/health
    autoDeploy: true
    envVars:
      # --- NeonDB ---
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # --- JWT secret (auto-generated by Render) ---
      - key: JWT_SECRET
        generateValue: true

      # --- CORS / frontend URL (update after the frontend service is Live) ---
      - key: APP_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # --- Google Sign-In ---
      - key: GOOGLE_CLIENT_ID
        sync: false

      # --- Phone OTP ---
      - key: REQUIRE_EMAIL_VERIFIED
        value: "false"
      - key: PHONE_DEV_RETURN_OTP
        value: "true"
      - key: PHONE_ADMIN_OTP
        value: "000000"

      # --- AI chat proxy (update after drishti-ai service is Live) ---
      - key: CHAT_API_URL
        sync: false

      # --- Optional SMTP ---
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # --- Production log levels ---
      - key: LOG_LEVEL_SECURITY
        value: INFO
      - key: LOG_LEVEL_OAUTH2
        value: INFO
      - key: LOG_LEVEL_APP
        value: INFO

  # ----------------------------------------------------------
  # Python AI assistant
  # ----------------------------------------------------------
  - type: web
    name: drishti-ai
    runtime: python
    rootDir: drishti-ai
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NVIDIA_API_KEY
        sync: false
      - key: AI_MODEL
        value: meta/llama-3.3-70b-instruct

  # ----------------------------------------------------------
  # React frontend (static site)
  # ----------------------------------------------------------
  - type: web
    name: drishti-frontend
    runtime: static
    rootDir: drishti-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    # SPA routing: every URL serves index.html so client-side routes work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # CRA reads REACT_APP_* at BUILD time; Render injects them during build.
      # Update these with the actual *.onrender.com URLs after the services are Live.
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_AI_URL
        sync: false
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
